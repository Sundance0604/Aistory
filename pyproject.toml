[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-activity"
version = "0.1.0"
description = "Local-first incremental ChatGPT activity analytics"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "playwright>=1.49",
  "pydantic>=2.9,<3",
  "tiktoken>=0.8,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
